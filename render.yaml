services:
  - type: web
    name: online-data-sub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run db:generate:prod && npm run build
    preDeployCommand: npm run db:push:prod
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: online-data-sub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set AFTER first deploy to https://online-data-sub.onrender.com (or your URL)
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: ASBDATA_BASE_URL
        value: https://asbdata.com
      - key: ASBDATA_TOKEN
        sync: false
      - key: ASBDATA_AIRTIME_TYPE
        value: VTU
      - key: ASBDATA_PLATFORM_MARKUP_NGN
        value: "0"
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: OnlineDataSub
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Online Data Sub <onboarding@resend.dev>
      # sandbox | live
      - key: PALMPAY_ENV
        sync: false
      - key: PALMPAY_APP_ID
        sync: false
      - key: PALMPAY_MERCHANT_PRIVATE_KEY
        sync: false
      - key: PALMPAY_PUBLIC_KEY
        sync: false
      - key: PALMPAY_MERCHANT_PUBLIC_KEY
        sync: false
      - key: PALMPAY_COUNTRY_CODE
        value: NG
      - key: PALMPAY_BANK_NAME
        value: PalmPay
      - key: GOLDAPI_KEY
        sync: false
      - key: USD_NGN_FALLBACK_RATE
        value: "1600"
      - key: REFERRAL_BONUS_KOBO
        value: "50000"

databases:
  - name: online-data-sub-db
    plan: free
    databaseName: online_data_sub
    user: online_data_sub
