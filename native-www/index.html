<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Online Data Sub</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f8fa;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: linear-gradient(160deg, #2c5aa0, #1a3a6b);
        color: #fff;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
      }
      p {
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      code {
        font-size: 0.75rem;
        color: #2c5aa0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">OD</div>
      <h1 style="font-size: 1.15rem; margin: 0 0 0.5rem">Online Data Sub</h1>
      <p>
        Native shell placeholder.<br />
        Point Capacitor <code>server.url</code> at your Railway app.
      </p>
    </div>
  </body>
</html>
