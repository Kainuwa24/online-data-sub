<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Online Data Sub</title>
    <style>
      :root {
        --blue: #2c5aa0;
        --blue-dark: #1a3a6b;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e8ecf2;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: linear-gradient(180deg, #f8fafc 0%, #eef3f8 52%, #f8fafc 100%);
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
        padding: 2rem 1.25rem;
        max-width: 20rem;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: #fff url("./app-logo.png") center / cover no-repeat;
        border: 1px solid var(--line);
        box-shadow: 0 3px 16px -6px rgba(15, 23, 42, 0.16);
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.4rem;
        font-weight: 800;
      }
      p {
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.5;
        margin: 0;
      }
      .spinner {
        width: 1.5rem;
        height: 1.5rem;
        margin: 1.25rem auto 0;
        border: 2.5px solid #e8f0fa;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // If opened as local shell, jump to production when possible
      (function () {
        var APP_URL = "https://onlinedatasub.com.ng";
        if (location.protocol === "file:" || location.hostname === "localhost") {
          // Keep placeholder; production builds use server.url
          return;
        }
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden></div>
      <h1>Online Data Sub</h1>
      <p>Loading your wallet…</p>
      <div class="spinner" aria-hidden></div>
    </div>
  </body>
</html>
